<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dev Journey Log</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🚀 Developer Coding Journal</h1>
        
        <!-- Form to Add Entries -->
        <form action="/add" method="POST" class="journal-form">
            <input type="text" name="task" placeholder="What did you build or learn today?" required>
            <input type="number" name="hours" placeholder="Hours" min="1" max="24" required>
            <button type="submit">Log Session</button>
        </form>

        <!-- Dynamic List of Entries -->
        <div class="entries-list">
            {% for entry in entries %}
            <div class="entry-card">
                <span class="date">{{ entry.date }}</span>
                <p class="task">{{ entry.task }}</p>
                <span class="hours">⚡ {{ entry.hours }} hrs</span>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
